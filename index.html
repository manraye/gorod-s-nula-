<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Город с нуля</title>
<style>
:root{--bg:#101923;--panel:#172431;--panel2:#223443;--line:#354b5d;--text:#f1f7fb;--muted:#a9bdca;--green:#27c69a;--blue:#57a8f5;--gold:#ffc85a;--red:#ff7777}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;touch-action:manipulation}
#game{position:fixed;inset:0;background:linear-gradient(#b7d8e2,#d8e8e8)}canvas{display:block;width:100%;height:100%;touch-action:none}
.top{position:fixed;top:env(safe-area-inset-top,8px);left:10px;right:10px;z-index:5;padding:11px 12px;background:rgba(16,27,39,.94);border:1px solid #3b5264;border-radius:17px;box-shadow:0 8px 28px #0003}
.topline{display:flex;align-items:center;justify-content:space-between;gap:8px}.brand{font-weight:850;font-size:16px;letter-spacing:.3px;line-height:1.1}.sub{font-size:11px;color:var(--muted);margin-top:3px}.stats{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:9px}.stat{background:#223443;border:1px solid #344b5d;border-radius:10px;padding:5px 8px;min-width:70px}.stat small{display:block;color:var(--muted);font-size:10px}.stat b{font-size:14px}.controls{display:flex;gap:5px}.iconbtn{border:1px solid #40576a;background:#263949;color:white;border-radius:10px;padding:9px 10px;font-size:14px;font-weight:700;min-width:37px}
#balance.negative{color:var(--red)}.hint{position:fixed;z-index:3;left:50%;top:43%;transform:translate(-50%,-50%);padding:8px 12px;border-radius:12px;background:#14212bc9;color:#fff;font-size:12px;text-align:center;white-space:normal;width:max-content;max-width:82%;pointer-events:none}
.bottom{position:fixed;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);z-index:5;background:rgba(16,27,39,.96);border:1px solid #3b5264;border-radius:18px;padding:9px;box-shadow:0 8px 28px #0004}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:8px}.tabs::-webkit-scrollbar{display:none}.tab{flex:0 0 auto;background:#243646;color:#dce8ef;border:1px solid #40576a;border-radius:11px;padding:10px 12px;font-weight:700;font-size:12px}.tab.active{background:#147e6a;border-color:#35d7b2;color:white}
.items{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.item{min-width:0;text-align:left;background:#223443;border:1px solid #3b5264;color:white;border-radius:12px;padding:9px 8px;min-height:74px}.item b{display:block;font-size:12px;line-height:1.2}.item small{display:block;color:#b5c8d3;font-size:10px;margin-top:6px;line-height:1.2}.item:disabled{opacity:.4}.item.selected{border:2px solid var(--green);background:#176e61}
#toast{position:fixed;z-index:10;left:50%;top:45%;transform:translate(-50%,-50%);background:#101b27f2;border:1px solid #506a7b;border-radius:12px;padding:12px 16px;max-width:85%;text-align:center;display:none;box-shadow:0 8px 30px #0005}
.modal{position:fixed;inset:0;z-index:20;background:#071019b8;display:none;align-items:center;justify-content:center;padding:18px}.modal.show{display:flex}.dialog{width:min(440px,100%);max-height:82vh;overflow:auto;background:#172431;border:1px solid #41586a;border-radius:18px;padding:18px}.dialog h2{margin:0 0 10px;font-size:20px}.dialog p{color:#c0d0d9;font-size:13px;line-height:1.45}.dialog button{margin:4px 4px 0 0}.wide{width:100%;padding:12px!important;margin-top:8px!important}.legend{font-size:11px;color:var(--muted);margin-top:7px}
@media(min-width:700px){.top{left:18px;right:18px;max-width:720px}.bottom{left:18px;right:18px;max-width:720px;margin:auto}.brand{font-size:18px}.items{grid-template-columns:repeat(4,minmax(0,1fr))}.item{min-height:82px}.item b{font-size:13px}}
</style>
</head>
<body>
<div id="game"></div>
<header class="top">
 <div class="topline">
  <div><div class="brand">🏙️ ГОРОД С НУЛЯ</div><div class="sub" id="dateLine">Новый город · День 1</div></div>
  <div class="controls"><button class="iconbtn" id="pauseBtn" aria-label="Пауза">Ⅱ</button><button class="iconbtn" id="speedBtn">×1</button><button class="iconbtn" id="settingsBtn">⚙</button></div>
 </div>
 <div class="stats">
  <div class="stat"><small>Бюджет</small><b id="balance">₡ 12 000</b></div>
  <div class="stat"><small>Население</small><b id="population">0</b></div>
  <div class="stat"><small>Доход / мес.</small><b id="income">₡ 0</b></div>
 </div>
</header>
<div class="hint" id="hint">Выбери здание снизу, затем коснись свободной клетки</div>
<div id="toast"></div>
<section class="bottom">
 <div class="tabs" id="tabs">
  <button class="tab active" data-cat="roads">🛣️ Дороги</button>
  <button class="tab" data-cat="homes">🏠 Жильё</button>
  <button class="tab" data-cat="services">⚡ Службы</button>
  <button class="tab" data-cat="parks">🌳 Услуги</button>
 </div>
 <div class="items" id="items"></div>
 <div class="legend" id="legend">Касайся карты, чтобы строить. Перетаскивай пальцем, чтобы осмотреть город.</div>
</section>
<div class="modal" id="modal"><div class="dialog"><h2 id="modalTitle">Настройки</h2><div id="modalBody"></div><button class="iconbtn wide" id="closeModal">Закрыть</button></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=> {
'use strict';
const $=id=>document.getElementById(id);
const game=$('game');
if(!window.THREE){$('hint').textContent='Не удалось загрузить 3D-библиотеку. Проверь интернет и обнови страницу.';return;}
const scene=new THREE.Scene();scene.background=new THREE.Color(0xb9d8e2);scene.fog=new THREE.Fog(0xb9d8e2,24,46);
const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.1,100);camera.position.set(12,17,20);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.7));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=false;renderer.outputEncoding=THREE.sRGBEncoding;game.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xeaf8ff,0x647d83,1.6));const sun=new THREE.DirectionalLight(0xfff1d3,1.5);sun.position.set(-8,18,10);scene.add(sun);
const N=16,cell=1.45,half=(N-1)*cell/2;let city={money:12000,day:1,pop:0,paused:false,speed:1,cat:'roads',selected:'road',buildings:[],roads:[],lastTime:Date.now(),monthTimer:0};
const defs={
 road:{name:'Дорога',cat:'roads',cost:35,upkeep:1,icon:'🛣️',color:0x586975,type:'road'},
 home:{name:'Жилой дом',cat:'homes',cost:550,upkeep:8,icon:'🏠',color:0xe6b777,type:'home',pop:8,tax:28},
 apartment:{name:'Многоквартирный дом',cat:'homes',cost:1450,upkeep:22,icon:'🏢',color:0xe2a26c,type:'apartment',pop:24,tax:72},
 solar:{name:'Солнечная станция',cat:'services',cost:850,upkeep:4,icon:'⚡',color:0x5c9ac4,type:'solar'},
 water:{name:'Водонапорная башня',cat:'services',cost:700,upkeep:6,icon:'🚰',color:0x8ab7d0,type:'water'},
 park:{name:'Городской парк',cat:'parks',cost:500,upkeep:7,icon:'🌳',color:0x54a66c,type:'park'},
 school:{name:'Школа',cat:'parks',cost:1100,upkeep:20,icon:'🏫',color:0xe6d8ad,type:'school'},
 fire:{name:'Пожарная часть',cat:'services',cost:950,upkeep:17,icon:'🚒',color:0xc95d55,type:'fire'}
};
const groundMat=new THREE.MeshLambertMaterial({color:0x9cb6a2}),tileMat=new THREE.MeshLambertMaterial({color:0xc6d9c7}),edgeMat=new THREE.LineBasicMaterial({color:0x839b91,transparent:true,opacity:.48});
const grid=new THREE.Group();scene.add(grid);const tiles=[];
for(let z=0;z<N;z++)for(let x=0;x<N;x++){
 const xx=x*cell-half,zz=z*cell-half;
 const base=new THREE.Mesh(new THREE.BoxGeometry(cell-.035,.12,cell-.035),tileMat);base.position.set(xx,-.08,zz);base.userData={x,z};grid.add(base);tiles.push(base);
}
const basePlane=new THREE.Mesh(new THREE.PlaneGeometry(N*cell+3,N*cell+3),groundMat);basePlane.rotation.x=-Math.PI/2;basePlane.position.y=-.16;scene.add(basePlane);
// Border and simple nature outside the build grid
const border=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(N*cell,.03,N*cell)),new THREE.LineBasicMaterial({color:0x678477}));border.position.y=-.01;scene.add(border);
function tree(x,z){const g=new THREE.Group();const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.045,.07,.28,6),new THREE.MeshLambertMaterial({color:0x82634c}));trunk.position.y=.14;g.add(trunk);const crown=new THREE.Mesh(new THREE.ConeGeometry(.22,.5,7),new THREE.MeshLambertMaterial({color:0x4d9872}));crown.position.y=.48;g.add(crown);g.position.set(x,.01,z);scene.add(g);}
for(let i=0;i<38;i++){let x=(Math.random()-.5)*(N*cell+4),z=(Math.random()-.5)*(N*cell+4);if(Math.abs(x)<half+1&&Math.abs(z)<half+1)continue;tree(x,z);}
const objects=new Map(),occupied=new Map();let currentCat='roads';
function coord(x,z){return {x:x*cell-half,z:z*cell-half};}
function buildingMesh(kind,x,z){
 const d=defs[kind],p=coord(x,z),g=new THREE.Group();g.position.set(p.x,0,p.z);
 const mat=c=>new THREE.MeshLambertMaterial({color:c});
 if(kind==='road'){
  const slab=new THREE.Mesh(new THREE.BoxGeometry(cell-.05,.08,cell-.05),mat(0x465966));slab.position.y=.015;g.add(slab);
  const line=new THREE.Mesh(new THREE.BoxGeometry(.52,.012,.045),mat(0xd7d7b7));line.position.y=.06;g.add(line);
 }else if(kind==='park'){
  const lawn=new THREE.Mesh(new THREE.BoxGeometry(cell-.08,.08,cell-.08),mat(0x78b87b));lawn.position.y=.02;g.add(lawn);
  for(let i=0;i<3;i++){const t=new THREE.Group();const tr=new THREE.Mesh(new THREE.CylinderGeometry(.035,.05,.22,5),mat(0x82634c));tr.position.y=.16;t.add(tr);const cr=new THREE.Mesh(new THREE.SphereGeometry(.14,7,6),mat(0x3f9461));cr.position.y=.34;t.add(cr);t.position.set((i-1)*.35,.05,(i%2?-.22:.2));g.add(t);}
 }else{
  const w=cell*.72,depth=cell*.72,h=kind==='home'?.85:kind==='apartment'?1.55:kind==='water'?1.25:kind==='solar'?.3:kind==='school'?.65:.7;
  if(kind==='solar'){
   const panel=new THREE.Mesh(new THREE.BoxGeometry(.82,.08,.6),mat(0x2c5e85));panel.position.y=.18;g.add(panel);
   for(let j=-1;j<=1;j++){const ln=new THREE.Mesh(new THREE.BoxGeometry(.82,.012,.018),mat(0xa8d6ef));ln.position.set(0,.23,j*.17);g.add(ln);}
  }else if(kind==='water'){
   const pole=new THREE.Mesh(new THREE.CylinderGeometry(.07,.1,.65,8),mat(0x7f9da8));pole.position.y=.33;g.add(pole);const tank=new THREE.Mesh(new THREE.CylinderGeometry(.28,.28,.45,10),mat(d.color));tank.position.y=.88;g.add(tank);
  }else{
   const body=new THREE.Mesh(new THREE.BoxGeometry(w,h,depth),mat(d.color));body.position.y=h/2+.04;g.add(body);
   if(kind==='home'||kind==='apartment'){const roof=new THREE.Mesh(new THREE.ConeGeometry(.62,.42,4),mat(0x9b6b58));roof.rotation.y=Math.PI/4;roof.position.y=h+.24;g.add(roof);}
   if(kind==='school'||kind==='fire'){const roof=new THREE.Mesh(new THREE.BoxGeometry(w+.08,.09,depth+.08),mat(kind==='fire'?0xa94343:0x6d8998));roof.position.y=h+.08;g.add(roof);}
   const winmat=mat(0x8bd2e8);for(let j=-1;j<=1;j++){const win=new THREE.Mesh(new THREE.BoxGeometry(.11,.13,.025),winmat);win.position.set(j*.28,h*.58,depth/2+.014);g.add(win);}
  }
 }
 g.traverse(o=>{if(o.isMesh){o.userData.gridX=x;o.userData.gridZ=z;}});scene.add(g);objects.set(x+','+z,g);return g;
}
function addBuilding(kind,x,z,quiet=false){
 const key=x+','+z;if(occupied.has(key)){if(!quiet)toast('Эта клетка уже занята');return false;}
 const d=defs[kind];if(city.money<d.cost){if(!quiet)toast('Не хватает средств');return false;}
 city.money-=d.cost;occupied.set(key,kind);city.buildings.push({kind,x,z});buildingMesh(kind,x,z);if(d.pop)city.pop+=d.pop;updateUI();if(!quiet)toast(d.name+' построен');return true;
}
function rebuild(){
 for(const g of objects.values())scene.remove(g);objects.clear();occupied.clear();city.pop=0;
 city.buildings.forEach(b=>{occupied.set(b.x+','+b.z,b.kind);buildingMesh(b.kind,b.x,b.z);if(defs[b.kind].pop)city.pop+=defs[b.kind].pop;});
 updateUI();
}
const raycaster=new THREE.Raycaster(),pointer=new THREE.Vector2();let dragging=false,downX=0,downY=0,lastX=0,lastY=0;
function pick(e){const r=renderer.domElement.getBoundingClientRect();pointer.x=(e.clientX-r.left)/r.width*2-1;pointer.y=-((e.clientY-r.top)/r.height*2-1);raycaster.setFromCamera(pointer,camera);const hits=raycaster.intersectObjects(tiles,false);if(hits.length){const u=hits[0].object.userData;placeAt(u.x,u.z);}}
function placeAt(x,z){const key=x+','+z;if(city.selected==='bulldoze'){if(!occupied.has(key)){toast('Здесь нечего сносить');return;}const kind=occupied.get(key);city.money+=Math.floor(defs[kind].cost*.35);city.buildings=city.buildings.filter(b=>!(b.x===x&&b.z===z));rebuild();toast('Объект снесён · часть стоимости возвращена');return;}addBuilding(city.selected,x,z);}
renderer.domElement.addEventListener('pointerdown',e=>{dragging=true;downX=lastX=e.clientX;downY=lastY=e.clientY;renderer.domElement.setPointerCapture?.(e.pointerId);});
renderer.domElement.addEventListener('pointermove',e=>{if(!dragging)return;const dx=e.clientX-lastX,dy=e.clientY-lastY;lastX=e.clientX;lastY=e.clientY;if(Math.hypot(e.clientX-downX,e.clientY-downY)>8){camera.position.x-=dx*.018;camera.position.z-=dy*.018;camera.lookAt(0,0,0);}});
renderer.domElement.addEventListener('pointerup',e=>{if(!dragging)return;dragging=false;if(Math.hypot(e.clientX-downX,e.clientY-downY)<8)pick(e);});
function toast(msg){const t=$('toast');t.textContent=msg;t.style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.style.display='none',1800);}
function fmt(n){return Math.round(n).toLocaleString('ru-RU');}
function updateUI(){
 $('balance').textContent='₡ '+fmt(city.money);$('balance').classList.toggle('negative',city.money<0);$('population').textContent=fmt(city.pop);
 const monthly=city.buildings.reduce((s,b)=>s+(defs[b.kind].tax||0)-(defs[b.kind].upkeep||0),0);
 $('income').textContent=(monthly>=0?'+':'−')+'₡ '+fmt(Math.abs(monthly));$('dateLine').textContent='День '+city.day+' · '+['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'][(Math.floor((city.day-1)/30))%12];
}
function renderItems(cat){
 currentCat=cat;$('tabs').querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.cat===cat));
 const items=Object.entries(defs).filter(([k,d])=>d.cat===cat);if(cat==='roads')items.push(['bulldoze',{name:'Сносить',icon:'🧹',cost:0,upkeep:0,cat:'roads',type:'bulldoze'}]);
 $('items').innerHTML='';items.forEach(([k,d])=>{const b=document.createElement('button');b.className='item'+(city.selected===k?' selected':'');b.innerHTML='<b>'+d.icon+' '+d.name+'</b><small>'+(k==='bulldoze'?'Возврат части стоимости':'₡ '+fmt(d.cost)+' · ₡ '+fmt(d.upkeep)+'/мес.')+'</small>';b.onclick=()=>{city.selected=k;renderItems(cat);$('hint').textContent=k==='bulldoze'?'Коснись здания, чтобы снести его':'Выбрано: '+d.name+' · коснись свободной клетки';};$('items').appendChild(b);});
}
$('tabs').addEventListener('click',e=>{const b=e.target.closest('[data-cat]');if(b)renderItems(b.dataset.cat);});
$('pauseBtn').onclick=()=>{city.paused=!city.paused;$('pauseBtn').textContent=city.paused?'▶':'Ⅱ';toast(city.paused?'Игра на паузе':'Игра продолжается');};
$('speedBtn').onclick=()=>{city.speed=city.speed===1?2:city.speed===2?3:1;$('speedBtn').textContent='×'+city.speed;};
function save(){const data={money:city.money,day:city.day,buildings:city.buildings};localStorage.setItem('gorodSNullaSaveV2',JSON.stringify(data));toast('Прогресс сохранён');}
function load(){try{const raw=localStorage.getItem('gorodSNullaSaveV2');if(!raw){toast('Сохранение пока не найдено');return;}const d=JSON.parse(raw);city.money=Number(d.money)||0;city.day=Number(d.day)||1;city.buildings=Array.isArray(d.buildings)?d.buildings.filter(b=>defs[b.kind]&&Number.isInteger(b.x)&&Number.isInteger(b.z)&&b.x>=0&&b.z>=0&&b.x<N&&b.z<N):[];rebuild();toast('Сохранение загружено');}catch(e){toast('Не удалось загрузить сохранение');}}
$('settingsBtn').onclick=()=>{$('modalTitle').textContent='Город и сохранение';$('modalBody').innerHTML='<p>Прогресс хранится в памяти этого браузера на устройстве.</p><button class="iconbtn wide" id="saveBtn">💾 Сохранить город</button><button class="iconbtn wide" id="loadBtn">📂 Загрузить сохранение</button><button class="iconbtn wide" id="resetBtn">↻ Начать заново</button><p>Подсказка: доход рассчитывается по жилью и расходам городских служб. Строй дороги и дома, чтобы развивать город.</p>'; $('modal').classList.add('show');$('saveBtn').onclick=save;$('loadBtn').onclick=load;$('resetBtn').onclick=()=>{if(confirm('Начать заново? Текущее состояние будет заменено.')){city.money=12000;city.day=1;city.buildings=[];rebuild();localStorage.removeItem('gorodSNullaSaveV2');toast('Новый город создан');}};};
$('closeModal').onclick=()=>$('modal').classList.remove('show');$('modal').addEventListener('click',e=>{if(e.target===$('modal'))$('modal').classList.remove('show');});
function tick(){if(!city.paused){city.monthTimer+=.016*city.speed;if(city.monthTimer>=8){city.monthTimer=0;city.day+=30;const net=city.buildings.reduce((s,b)=>s+(defs[b.kind].tax||0)-(defs[b.kind].upkeep||0),0);city.money+=net;updateUI();if(city.money<0)toast('Внимание: бюджет отрицательный');}}}
function animate(){requestAnimationFrame(animate);tick();renderer.render(scene,camera);} 
function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);}
addEventListener('resize',resize);camera.lookAt(0,0,0);renderItems('roads');updateUI();
try{const raw=localStorage.getItem('gorodSNullaSaveV2');if(raw){const d=JSON.parse(raw);city.money=Number(d.money)||12000;city.day=Number(d.day)||1;city.buildings=Array.isArray(d.buildings)?d.buildings.filter(b=>defs[b.kind]&&b.x>=0&&b.z>=0&&b.x<N&&b.z<N):[];rebuild();}}catch(e){}
animate();
})();
</script>
</body>
</html>
