<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#101923">
<title>Город с нуля</title>
<style>
:root{--panel:rgba(15,24,34,.91);--line:rgba(255,255,255,.13);--text:#f4f7fb;--muted:#aebbc9;--accent:#69d4b2;--gold:#ffd166}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#8ec6d1;color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overscroll-behavior:none;touch-action:none}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#game{position:fixed;inset:0;overflow:hidden}canvas{display:block;width:100%;height:100%;touch-action:none}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(12px);box-shadow:0 8px 24px #07111b30}
#top{position:absolute;top:calc(env(safe-area-inset-top) + 8px);left:8px;right:8px;display:flex;align-items:center;gap:7px;padding:8px;z-index:4}
.brand{font-size:12px;color:var(--muted);font-weight:800;letter-spacing:.06em}.metric{min-width:0;flex:1}.metric strong{display:block;font-size:14px;white-space:nowrap}.metric small{display:block;font-size:10px;color:var(--muted);white-space:nowrap}
button,select{font:inherit;color:var(--text);border:1px solid var(--line);background:#253544;border-radius:10px;min-height:44px;min-width:44px;padding:7px 10px;touch-action:manipulation}
button:active{transform:scale(.97);filter:brightness(1.2)}button.active{background:#197c6a;border-color:#6be2c3}
#speed{display:flex;gap:3px}#speed button{min-width:38px;padding:5px}
#rci{position:absolute;left:8px;top:100px;z-index:3;padding:9px 8px;width:47px;display:grid;gap:8px;text-align:center}
.rcirow{font-size:10px;font-weight:800}.bar{height:64px;width:12px;background:#ffffff20;border-radius:7px;margin:4px auto 0;display:flex;align-items:end;overflow:hidden}.fill{width:100%;height:40%;border-radius:7px;transition:height .3s}
#news{position:absolute;top:100px;left:64px;right:8px;z-index:2;padding:8px 11px;font-size:11px;color:#e4edf4;min-height:34px}
#bottom{position:absolute;left:8px;right:8px;bottom:calc(env(safe-area-inset-bottom) + 8px);z-index:5;padding:8px}
#tools{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:6px;touch-action:pan-x}#tools::-webkit-scrollbar{display:none}
.tool{flex:0 0 auto;font-size:11px;min-height:44px;padding:7px 11px;white-space:nowrap}
#cards{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding:3px 0 1px;touch-action:pan-x}#cards button{flex:0 0 108px;text-align:left;font-size:11px;line-height:1.3;min-height:62px}
#cards button b{display:block;font-size:12px}#cards button small{color:#b8c6d4}
#hint{position:absolute;left:64px;right:8px;bottom:205px;z-index:2;text-align:center;font-size:11px;color:#fff;text-shadow:0 1px 4px #123;pointer-events:none}
#modal{position:absolute;z-index:8;left:12px;right:12px;top:50%;transform:translateY(-50%);max-height:72%;overflow:auto;padding:16px;display:none}
#modal h2{font-size:18px;margin:0 0 8px}#modal p{font-size:13px;line-height:1.5;color:#d2dce6;margin:7px 0}#modal .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
#modal .actions button{flex:1}
#toast{position:absolute;left:50%;top:23%;transform:translateX(-50%);z-index:9;background:#10202ddd;border:1px solid var(--line);padding:10px 14px;border-radius:12px;font-size:12px;display:none;max-width:90%;text-align:center}
#legend{position:absolute;right:8px;top:100px;z-index:2;font-size:10px;color:#fff;text-shadow:0 1px 3px #123;text-align:right;pointer-events:none}
@media (orientation:landscape){#top{max-width:680px}#bottom{left:70px;right:70px}#rci{top:90px}#news{top:90px;max-width:380px}#hint{bottom:175px}#cards button{flex-basis:125px}}
</style>
</head>
<body>
<div id="game">
  <div id="top" class="panel">
    <div class="metric"><div class="brand">🏙 ГОРОД С НУЛЯ</div><strong id="money">₡ 12 000</strong><small id="balance">Баланс +₡0/мес.</small></div>
    <div class="metric"><strong id="population">👥 0</strong><small>население</small></div>
    <div class="metric"><strong id="date">Май, год 1</strong><small id="clock">08:00</small></div>
    <div id="speed"><button data-speed="0">Ⅱ</button><button data-speed="1" class="active">▶</button><button data-speed="2">×2</button><button data-speed="3">×3</button></div>
    <button id="settings" aria-label="Настройки">⚙</button>
  </div>
  <div id="rci" class="panel">
    <div class="rcirow" style="color:#75e59a">Ж<small> спрос</small><div class="bar"><div id="r" class="fill" style="background:#4de184"></div></div></div>
    <div class="rcirow" style="color:#68baff">К<small> спрос</small><div class="bar"><div id="c" class="fill" style="background:#4ba9ff"></div></div></div>
    <div class="rcirow" style="color:#ffd36a">П<small> спрос</small><div class="bar"><div id="i" class="fill" style="background:#ffc447"></div></div></div>
  </div>
  <div id="news" class="panel">📣 Совет мэра: построй дорогу, затем жилую зону рядом с ней.</div>
  <div id="legend">Проведи пальцем по карте<br>чтобы двигать камеру</div>
  <div id="hint">Выбери инструмент внизу • щипок — масштаб • два пальца — поворот</div>
  <div id="bottom" class="panel">
    <div id="tools"></div>
    <div id="cards"></div>
  </div>
  <div id="modal" class="panel"></div><div id="toast"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script>
(()=>{'use strict';
// ─── Конфигурация и данные игры ──────────────────────────────────────────────
const SAVE_KEY='city_from_zero_v1';
const W=44,H=44,CELL=2;
const TYPES={
 road:{name:'Улица',price:35,maint:1,kind:'road',color:0x505b66},
 dirt:{name:'Грунтовка',price:15,maint:.3,kind:'road',color:0x987b59},
 avenue:{name:'Проспект',price:75,maint:2,kind:'road',color:0x3d4854},
 res:{name:'Жилая зона',price:18,kind:'zone',color:0x48b66a},
 com:{name:'Коммерческая зона',price:22,kind:'zone',color:0x438edb},
 ind:{name:'Промышленная зона',price:20,kind:'zone',color:0xd7a83c},
 office:{name:'Офисная зона',price:28,kind:'zone',color:0x37bfc2},
 power:{name:'Солнечная станция',price:1200,maint:45,kind:'service',power:80,water:0,desc:'Производит 80 единиц электричества.'},
 water:{name:'Водонапорная башня',price:850,maint:30,kind:'service',power:0,water:100,desc:'Обеспечивает город чистой водой.'},
 park:{name:'Городской парк',price:500,maint:15,kind:'service',power:0,water:0,desc:'Повышает счастье жителей поблизости.'},
 fire:{name:'Пожарная часть',price:950,maint:35,kind:'service',power:5,water:5,desc:'Снижает риск серьёзных пожаров.'},
 school:{name:'Школа',price:1100,maint:40,kind:'service',power:8,water:5,desc:'Повышает образование жителей.'}
};
const CATEGORIES=[
 ['roads','🛣 Дороги',['road','dirt','avenue','bulldoze']],
 ['zones','🏘 Зонирование',['res','com','ind','office']],
 ['utilities','⚡ Коммунальные',['power','water']],
 ['services','🌳 Услуги',['park','fire','school']],
 ['city','🏙 Город',['budget','save','load','new']]
];
const state={money:12000,day:1,month:5,year:1,hour:8,speed:1,pop:0,happiness:72,taxes:{res:9,com:10,ind:11},roads:[],zones:[],buildings:[],selected:null,tool:'road',category:'roads',demand:{res:70,com:45,ind:55},news:[],serial:1};
const key=(x,z)=>x+','+z, clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
let scene,camera,renderer,world,ground,waterMesh,raycaster=new THREE.Raycaster(),pointer=new THREE.Vector2();
let meshes=new Map(),roadMeshes=new Map(),zoneMeshes=new Map(),buildingMeshes=new Map(),effects=[];
let dragging=null,lastTouch=null,pinchDist=0,camYaw=Math.PI/4,camZoom=65,camTarget=new THREE.Vector3(0,0,0),velX=0,velZ=0;
let activeCategory='roads',activeTool='road',selectedObject=null,simAccum=0,autosave=0,dayLight=0.7;
const $=id=>document.getElementById(id);
function toast(msg){const el=$('toast');el.textContent=msg;el.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>el.style.display='none',2100)}
function addNews(msg){state.news.unshift(msg);state.news=state.news.slice(0,5);$('news').textContent='📣 '+msg}
function format(n){return Math.round(n).toLocaleString('ru-RU')}
function mat(color,rough=.82){return new THREE.MeshStandardMaterial({color,roughness:rough})}
function box(w,h,d,color,x,y,z,group,opts={}){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(color));m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;group.add(m);return m}
function cylinder(rt,rb,h,color,x,y,z,group,seg=10){const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg),mat(color));m.position.set(x,y,z);m.castShadow=true;group.add(m);return m}
function sphere(r,color,x,y,z,group){const m=new THREE.Mesh(new THREE.SphereGeometry(r,10,8),mat(color));m.position.set(x,y,z);m.castShadow=true;group.add(m);return m}
function groupAt(x,a,b){const g=new THREE.Group();if(b===undefined)g.position.set(x,0,a);else g.position.set(x,a,b);scene.add(g);return g}
function gridPos(x,z){return {x:clamp(Math.round(x/CELL+W/2),0,W-1),z:clamp(Math.round(z/CELL+H/2),0,H-1)}}
function worldPos(x,z){return {x:(x-W/2)*CELL,z:(z-H/2)*CELL}}
function seeded(x,z){const v=Math.sin(x*127.1+z*311.7)*43758.5453;return v-Math.floor(v)}
// ─── World / Map: ландшафт, озеро, лес ──────────────────────────────────────
function init3D(){
 scene=new THREE.Scene();scene.background=new THREE.Color(0x91cbdc);scene.fog=new THREE.Fog(0x91cbdc,80,190);
 camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.1,500);
 renderer=new THREE.WebGLRenderer({antialias:true,alpha:false,powerPreference:'high-performance'});
 renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));renderer.setSize(innerWidth,innerHeight);renderer.outputEncoding=THREE.sRGBEncoding;
 renderer.shadowMap.enabled=false;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.08;
 $('game').prepend(renderer.domElement);
 scene.add(new THREE.HemisphereLight(0xe4f7ff,0x53664a,1.35));
 const sun=new THREE.DirectionalLight(0xfff0d2,2);sun.position.set(-35,60,-20);scene.add(sun);
 world=new THREE.Group();scene.add(world);
 // Рельеф — отдельные плитки с мягкими перепадами высоты
 const geo=new THREE.PlaneGeometry(CELL,CELL,1,1);geo.rotateX(-Math.PI/2);
 for(let x=0;x<W;x++)for(let z=0;z<H;z++){
   const p=worldPos(x,z),n=seeded(x,z),lake=((x-31)/7)**2+((z-14)/10)**2<1;
   let y=(n-.5)*.35+Math.sin(x*.25)*.12+Math.cos(z*.22)*.1;
   const color=lake?0x4ba9c9:(n>.84?0x83b968:n<.12?0x8cae65:0x75b96c);
   const g=new THREE.Mesh(new THREE.PlaneGeometry(CELL,CELL),mat(color));g.rotation.x=-Math.PI/2;g.position.set(p.x,y,p.z);g.receiveShadow=true;world.add(g);
   if(!lake&&n>.93&&x>3&&z>3&&x<W-3&&z<H-3&&!nearSpawn(x,z)){
     const tree=groupAt(p.x,p.z);tree.position.y=y;
     cylinder(.08,.13,.55,0x76513a,0,.28,0,tree,7);sphere(.42, n>.97?0x2f8550:0x3e9953,0,.78,0,tree);sphere(.28,0x58ae62,.16,1.03,.06,tree);
   }
 }
 // Озеро как гладкая поверхность поверх рельефа
 const lakeGeo=new THREE.CircleGeometry(13,48);lakeGeo.rotateX(-Math.PI/2);waterMesh=new THREE.Mesh(lakeGeo,new THREE.MeshStandardMaterial({color:0x3ba9d0,roughness:.28,metalness:.08}));waterMesh.position.set(worldPos(31,14).x,.02,worldPos(31,14).z);world.add(waterMesh);
 // Стартовая дорога и небольшой посёлок
 for(let x=17;x<=25;x++)placeRoad(x,24,'road',true);
 for(let z=21;z<=27;z++)placeRoad(21,z,'road',true);
 for(let x=17;x<26;x+=2)placeZone(x,22,'res',true);
 updateCamera();
}
function nearSpawn(x,z){return x>13&&x<29&&z>18&&z<30}
function groundY(x,z){return (seeded(x,z)-.5)*.35+Math.sin(x*.25)*.12+Math.cos(z*.22)*.1}
// ─── Camera + touch input ───────────────────────────────────────────────────
function updateCamera(){const h=camZoom,dist=h/Math.sin(1.02);camera.position.set(camTarget.x+Math.sin(camYaw)*dist,h,camTarget.z+Math.cos(camYaw)*dist);camera.lookAt(camTarget);camera.updateProjectionMatrix()}
function panCamera(dx,dy){const scale=camZoom*.0017;velX=-dx*scale;velZ=dy*scale;const c=Math.cos(camYaw),s=Math.sin(camYaw);camTarget.x+=(-dx*c+dy*s)*scale;camTarget.z+=(dx*s+dy*c)*scale;camTarget.x=clamp(camTarget.x,-42,42);camTarget.z=clamp(camTarget.z,-42,42);updateCamera()}
function pickAt(clientX,clientY){pointer.x=clientX/innerWidth*2-1;pointer.y=-(clientY/innerHeight)*2+1;raycaster.setFromCamera(pointer,camera);const targets=[];scene.traverse(o=>{if(o.userData.pickable)targets.push(o)});const hits=raycaster.intersectObjects(targets,false);return hits.length?hits[0].object:null}
let touchStart=null,moved=false,longTimer=null;
rendererSafeEvents();
function rendererSafeEvents(){
 const el=$('game');
 el.addEventListener('contextmenu',e=>e.preventDefault());
 el.addEventListener('touchstart',e=>{if(e.target.closest('button')||e.target.closest('#bottom')||e.target.closest('#modal'))return;if(e.touches.length===2){pinchDist=distance(e.touches[0],e.touches[1]);lastTouch={x:(e.touches[0].clientX+e.touches[1].clientX)/2,y:(e.touches[0].clientY+e.touches[1].clientY)/2};dragging='multi';clearTimeout(longTimer);return;}const t=e.touches[0];touchStart={x:t.clientX,y:t.clientY,time:Date.now()};lastTouch={x:t.clientX,y:t.clientY};moved=false;dragging='one';longTimer=setTimeout(()=>{if(!moved&&touchStart){const hit=pickAt(t.clientX,t.clientY);if(hit)showObject(hit.userData.ref);else toast('Пустой участок карты');}},620);},{passive:false});
 el.addEventListener('touchmove',e=>{if(e.target.closest('#bottom')||e.target.closest('#modal'))return;e.preventDefault();if(e.touches.length===2){const d=distance(e.touches[0],e.touches[1]),mid={x:(e.touches[0].clientX+e.touches[1].clientX)/2,y:(e.touches[0].clientY+e.touches[1].clientY)/2};if(pinchDist){camZoom=clamp(camZoom*pinchDist/d,28,105)}if(lastTouch)camYaw+=(mid.x-lastTouch.x)*.008;pinchDist=d;lastTouch=mid;updateCamera();moved=true;clearTimeout(longTimer);return;}if(dragging==='one'&&lastTouch){const t=e.touches[0],dx=t.clientX-lastTouch.x,dy=t.clientY-lastTouch.y;if(Math.abs(t.clientX-touchStart.x)+Math.abs(t.clientY-touchStart.y)>8){moved=true;clearTimeout(longTimer);if(activeTool==='road'||activeTool==='dirt'||activeTool==='avenue'||activeTool==='bulldoze'||['res','com','ind','office'].includes(activeTool)){const hit=pickGround(t.clientX,t.clientY);if(hit)paintAt(hit.x,hit.z);else panCamera(dx,dy)}else panCamera(dx,dy);}lastTouch={x:t.clientX,y:t.clientY};}},{passive:false});
 el.addEventListener('touchend',e=>{clearTimeout(longTimer);if(e.changedTouches.length&&touchStart&&!moved){const t=e.changedTouches[0],hit=pickAt(t.clientX,t.clientY);if(hit&&hit.userData.ref)showObject(hit.userData.ref);else{const gp=pickGround(t.clientX,t.clientY);if(gp)handleTap(gp.x,gp.z)}}dragging=null;touchStart=null;lastTouch=null;pinchDist=0;},{passive:false});
 // Поддержка мыши для тестирования на компьютере
 el.addEventListener('mousedown',e=>{if(e.target.closest('button')||e.target.closest('#bottom'))return;touchStart={x:e.clientX,y:e.clientY,time:Date.now()};lastTouch={x:e.clientX,y:e.clientY};moved=false;dragging='mouse';});
 window.addEventListener('mousemove',e=>{if(dragging!=='mouse'||!lastTouch)return;const dx=e.clientX-lastTouch.x,dy=e.clientY-lastTouch.y;if(Math.abs(e.clientX-touchStart.x)+Math.abs(e.clientY-touchStart.y)>5){moved=true;panCamera(dx,dy)}lastTouch={x:e.clientX,y:e.clientY}});
 window.addEventListener('mouseup',e=>{if(dragging==='mouse'&&touchStart&&!moved){const hit=pickAt(e.clientX,e.clientY);if(hit&&hit.userData.ref)showObject(hit.userData.ref);else{const gp=pickGround(e.clientX,e.clientY);if(gp)handleTap(gp.x,gp.z)}}dragging=null;touchStart=null;lastTouch=null});
 window.addEventListener('wheel',e=>{camZoom=clamp(camZoom+e.deltaY*.035,28,105);updateCamera()},{passive:true});
 window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio||1,2))});
}
function distance(a,b){return Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)}
function pickGround(x,y){pointer.x=x/innerWidth*2-1;pointer.y=-(y/innerHeight)*2+1;raycaster.setFromCamera(pointer,camera);const plane=new THREE.Plane(new THREE.Vector3(0,1,0),0);const v=new THREE.Vector3();const ok=raycaster.ray.intersectPlane(plane,v);if(!ok)return null;const g=gridPos(v.x,v.z);return {x:g.x,z:g.z}}
function handleTap(x,z){if(activeTool==='save'){saveGame();return}if(activeTool==='load'){loadGame();return}if(activeTool==='new'){if(confirm('Начать новый город? Текущий прогресс будет заменён.'))newGame();return}if(activeTool==='budget'){showBudget();return}if(activeTool==='bulldoze'){demolishAt(x,z);return}if(TYPES[activeTool]?.kind==='road'){placeRoad(x,z,activeTool);return}if(TYPES[activeTool]?.kind==='zone'){placeZone(x,z,activeTool);return}if(TYPES[activeTool]?.kind==='service'){placeBuilding(x,z,activeTool);return}toast('Выбери инструмент строительства внизу')}
function paintAt(x,z){if(activeTool==='bulldoze')demolishAt(x,z);else if(TYPES[activeTool]?.kind==='road')placeRoad(x,z,activeTool);else if(TYPES[activeTool]?.kind==='zone')placeZone(x,z,activeTool)}
// ─── Roads / Zoning / Buildings ─────────────────────────────────────────────
function placeRoad(x,z,type,free=false){x=clamp(x,0,W-1);z=clamp(z,0,H-1);const k=key(x,z);if(state.roads.some(r=>r.k===k))return;if(!free&&!pay(TYPES[type].price))return;state.roads.push({k,x,z,type});const p=worldPos(x,z),g=groupAt(p.x,groundY(x,z)+.05,p.z);const width=type==='avenue'?1.7:1.25;const road=box(width,.12,1.95,TYPES[type].color,0,0,0,g);road.rotation.y=0;road.userData.pickable=true;road.userData.ref={kind:'road',k};roadMeshes.set(k,g); // Разметка
 if(type!=='dirt')box(.055,.125,.7,0xe8dca3,0,.07,0,g);
 refreshRoadJunctions(x,z);if(!free)refreshUI();
}
function refreshRoadJunctions(x,z){for(const [dx,dz] of [[1,0],[-1,0],[0,1],[0,-1]]){const r=state.roads.find(v=>v.x===x+dx&&v.z===z+dz);if(r){const g=roadMeshes.get(r.k);if(g){/* плитки стыкуются без щелей, перекрёсток визуально автоматический */}}}}
function placeZone(x,z,type,free=false){x=clamp(x,0,W-1);z=clamp(z,0,H-1);const k=key(x,z);if(state.zones.some(v=>v.k===k)||state.roads.some(v=>v.k===k))return;if(!hasAdjacentRoad(x,z)){toast('Зона должна примыкать к дороге');return}if(!free&&!pay(TYPES[type].price))return;state.zones.push({k,x,z,type,age:0});const p=worldPos(x,z),g=groupAt(p.x,groundY(x,z)+.06,p.z);const m=box(1.6,.035,1.6,TYPES[type].color,0,0,0,g);m.material.transparent=true;m.material.opacity=.38;m.userData.pickable=true;m.userData.ref={kind:'zone',k};zoneMeshes.set(k,g);if(!free)refreshUI()}
function hasAdjacentRoad(x,z){return state.roads.some(r=>Math.abs(r.x-x)+Math.abs(r.z-z)<=2)}
function placeBuilding(x,z,type,free=false){const k=key(x,z);if(state.buildings.some(b=>b.k===k)||state.roads.some(r=>r.k===k)||state.zones.some(a=>a.k===k)){toast('Здесь уже занято');return}if(!free&&!pay(TYPES[type].price))return;const b={id:state.serial++,k,x,z,type,level:1,age:0,people:0,workers:0};state.buildings.push(b);renderBuilding(b,true);if(!free){addNews('Построено: '+TYPES[type].name);refreshUI()}}
function renderBuilding(b,bounce=false){const p=worldPos(b.x,b.z),g=groupAt(p.x,groundY(b.x,b.z)+.08,p.z);g.userData.ref={kind:'building',id:b.id};const palette={res:[0xf2c66d,0x72b6d9,0xf0a07c,0xd8dce6],com:[0x5c9fe8,0x4b83bd,0xf2b84b,0x9b83d9],ind:[0xc4a45b,0x8b9b9f,0xc98a4b,0x9eacb5],office:[0x61c4c8,0x5ba5c4,0x7ca9d6,0x86d3c5]};const type=b.type,level=b.level||1,color=palette[type][(b.id*7)%4];let h=(type==='res'?1.6:type==='com'?2.2:type==='ind'?1.4:2.8)*(.8+level*.45);
 const w=type==='ind'?1.6:1.35,d=type==='res'?1.35:1.55;
 box(w,h,d,color,0,h/2,0,g);
 // Крыша с ярким акцентом
 box(w+.12,.14,d+.12,level>2?0x4b667c:0x43576a,0,h+.05,0,g);
 // Окна спереди и сбоку
 const windowColor=dayLight<.28?0xffd878:0x9be3ed;
 for(let yy=.45;yy<h-.1;yy+=.48){for(let xx=-w/2+.22;xx<w/2;xx+=.4){box(.18,.22,.025,windowColor,xx,yy,d/2+.014,g)}}
 for(let yy=.45;yy<h-.1;yy+=.48)box(.025,.22,.18,windowColor,w/2+.014,yy,0,g);
 box(.28,.45,.035,0x80543b,0,.25,d/2+.025,g);
 if(type==='ind'){cylinder(.12,.15,.65,0x78858a,-.35,h+.38,-.3,g,8);cylinder(.08,.11,.45,0x9ba8ab,.35,h+.28,.2,g,8)}
 if(type==='res'&&level>1)sphere(.18,0x58b86c,0,h+.22,0,g);
 g.traverse(o=>{if(o.isMesh){o.userData.pickable=true;o.userData.ref={kind:'building',id:b.id}}});
 if(bounce){g.scale.setScalar(.05);effects.push({type:'bounce',obj:g,t:0,duration:.35})}
 buildingMeshes.set(b.id,g);
}
function growZone(z){const road=hasAdjacentRoad(z.x,z.z);if(!road)return;const power=state.buildings.some(b=>['power'].includes(b.type)),water=state.buildings.some(b=>b.type==='water');if(!power||!water)return;if(seeded(z.x+state.day,z.z+state.pop)>.75){const b={id:state.serial++,k:z.k,x:z.x,z:z.z,type:z.type,level:1,age:0,people:0,workers:0};state.buildings.push(b);renderBuilding(b,true);const idx=state.zones.findIndex(a=>a.k===z.k);if(idx>=0){const m=zoneMeshes.get(z.k);if(m){scene.remove(m);zoneMeshes.delete(z.k)}state.zones.splice(idx,1)}}}
function demolishAt(x,z){const k=key(x,z);const r=state.roads.findIndex(v=>v.k===k);if(r>=0){state.roads.splice(r,1);const m=roadMeshes.get(k);if(m)scene.remove(m);roadMeshes.delete(k);toast('Дорога удалена');refreshUI();return}const zi=state.zones.findIndex(v=>v.k===k);if(zi>=0){state.zones.splice(zi,1);const m=zoneMeshes.get(k);if(m)scene.remove(m);zoneMeshes.delete(k);refreshUI();return}const bi=state.buildings.findIndex(v=>v.k===k);if(bi>=0){const b=state.buildings[bi];state.money+=Math.round((TYPES[b.type]?.price||100)*.25);const m=buildingMeshes.get(b.id);if(m)scene.remove(m);buildingMeshes.delete(b.id);state.buildings.splice(bi,1);addNews('Здание снесено. Часть стоимости возвращена.');refreshUI();return}toast('Здесь нечего сносить')}
function showObject(ref){if(!ref)return;if(ref.kind==='building'){const b=state.buildings.find(v=>v.id===ref.id);if(!b)return;selectedObject=b;const t=TYPES[b.type];$('modal').innerHTML=`<h2>${t.name}</h2><p>Уровень: ${b.level||1}</p><p>Статус: ${hasAdjacentRoad(b.x,b.z)?'🟢 Есть доступ к дороге':'🔴 Нет дороги'}<br>Электричество: ${state.buildings.some(x=>x.type==='power')?'🟢 Сеть работает':'🔴 Нет электричества'}<br>Вода: ${state.buildings.some(x=>x.type==='water')?'🟢 Водоснабжение есть':'🔴 Нет воды'}</p><p>${t.desc||'Городское здание.'}</p><div class="actions"><button id="upgrade">⬆ Улучшить · ₡${format(350*b.level)}</button><button id="demolish">Снести</button><button id="close">Закрыть</button></div>`;$('modal').style.display='block';$('upgrade').onclick=()=>{const cost=350*b.level;if(pay(cost)){b.level++;const old=buildingMeshes.get(b.id);if(old)scene.remove(old);renderBuilding(b,true);addNews('Здание улучшено до уровня '+b.level);showObject({kind:'building',id:b.id});refreshUI()}};$('demolish').onclick=()=>{demolishAt(b.x,b.z);$('modal').style.display='none'};$('close').onclick=()=>{$('modal').style.display='none'};return}if(ref.kind==='road'){const r=state.roads.find(v=>v.k===ref.k);if(r)toast(TYPES[r.type].name+' • содержание '+(TYPES[r.type].maint||0)+' ₡/мес.')}else if(ref.kind==='zone'){const z=state.zones.find(v=>v.k===ref.k);if(z)toast(TYPES[z.type].name+' • ожидает застройки')}}
function showBudget(){const bal=calcBalance();$('modal').innerHTML=`<h2>💰 Экономика города</h2><p>Доходы: <b style="color:#69d4b2">₡${format(calcIncome())}/мес.</b></p><p>Расходы: <b style="color:#ff8e8e">₡${format(calcExpenses())}/мес.</b></p><p>Баланс: <b>${bal>=0?'+':''}₡${format(bal)}</b></p><p>Налог на жильё: ${state.taxes.res}% <input id="taxres" type="range" min="5" max="20" value="${state.taxes.res}" style="width:100%"></p><p>Налог на магазины: ${state.taxes.com}% <input id="taxcom" type="range" min="5" max="20" value="${state.taxes.com}" style="width:100%"></p><p>Налог на промышленность: ${state.taxes.ind}% <input id="taxind" type="range" min="5" max="20" value="${state.taxes.ind}" style="width:100%"></p><div class="actions"><button id="close">Готово</button></div>`;$('modal').style.display='block';['res','com','ind'].forEach(k=>{$('tax'+k).oninput=e=>{state.taxes[k]=+e.target.value;showBudget()}});$('close').onclick=()=>$('modal').style.display='none'}
function pay(amount){if(state.money<amount){toast('Недостаточно средств!');return false}state.money-=amount;return true}
// ─── Economy / Citizens / Simulation ────────────────────────────────────────
function calcIncome(){let income=0;for(const b of state.buildings){if(b.type==='res')income+=65*state.taxes.res/10;if(b.type==='com')income+=105*state.taxes.com/10;if(b.type==='ind')income+=120*state.taxes.ind/10;if(b.type==='office')income+=135}income+=state.pop*.7;return income}
function calcExpenses(){let total=0;for(const r of state.roads)total+=TYPES[r.type].maint||0;for(const b of state.buildings)total+=TYPES[b.type]?.maint||0;return total}
function calcBalance(){return calcIncome()-calcExpenses()}
function simulate(dt){if(state.speed===0)return;simAccum+=dt*state.speed;while(simAccum>=1){simAccum-=1;state.hour++;if(state.hour>=24){state.hour=0;state.day++;dailyTick()}if(state.day>30){state.day=1;state.month++;if(state.month>12){state.month=1;state.year++}state.money+=calcBalance();if(state.money<0)addNews('Бюджет ушёл в минус! Сократи расходы или расширь налоговую базу.');if(state.month===1)addNews('Наступил новый год. Подведи итоги развития города.')}if(state.hour===8&&Math.random()<.06&&state.buildings.length>3)addNews(['Жители просят больше парков 🌳','На дорогах стало оживлённее 🚗','Горожане обсуждают новый район 🏘','Мэрия напоминает следить за бюджетом 💰'][Math.floor(Math.random()*4)]);}}
function dailyTick(){for(const z of [...state.zones])growZone(z);state.pop=state.buildings.reduce((sum,b)=>sum+(b.type==='res'?Math.round(8*(b.level||1)):0),0);state.happiness=clamp(60+state.buildings.filter(b=>b.type==='park').length*3-state.buildings.filter(b=>b.type==='ind').length*2,15,98);state.demand.res=clamp(75-state.buildings.filter(b=>b.type==='res').length*5+Math.round((state.happiness-60)*.6),5,100);state.demand.com=clamp(55-state.buildings.filter(b=>b.type==='com').length*7+Math.floor(state.pop/12),5,100);state.demand.ind=clamp(65-state.buildings.filter(b=>b.type==='ind').length*6+Math.floor(state.pop/20),5,100);if(state.day%5===0)autosaveGame();refreshUI()}
function refreshUI(){const bal=calcBalance();$('money').textContent='₡ '+format(state.money);$('balance').textContent='Баланс '+(bal>=0?'+':'−')+'₡'+format(Math.abs(bal))+'/мес.';$('balance').style.color=bal>=0?'#69d4b2':'#ff8e8e';$('population').textContent='👥 '+format(state.pop);$('date').textContent=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'][state.month-1]+', год '+state.year;$('clock').textContent=String(state.hour).padStart(2,'0')+':00';$('r').style.height=state.demand.res+'%';$('c').style.height=state.demand.com+'%';$('i').style.height=state.demand.ind+'%';}
function setSpeed(n){state.speed=n;document.querySelectorAll('#speed button').forEach(b=>b.classList.toggle('active',+b.dataset.speed===n));}
function dayNight(){const t=(state.hour/24)*Math.PI*2;dayLight=.2+.8*Math.max(0,Math.sin(t-Math.PI/2));const col=new THREE.Color().setHSL(.55,.38,.18+dayLight*.55);scene.background=col;scene.fog.color.copy(col);scene.traverse(o=>{if(o.isMesh&&o.material&&o.material.emissive){}})}
// ─── UI / Save ───────────────────────────────────────────────────────────────
function buildUI(){const tools=$('tools'),cards=$('cards');CATEGORIES.forEach(([id,label])=>{const b=document.createElement('button');b.className='tool'+(id===activeCategory?' active':'');b.textContent=label;b.onclick=()=>{activeCategory=id;document.querySelectorAll('.tool').forEach(v=>v.classList.toggle('active',v===b));renderCards()};tools.appendChild(b)});renderCards();document.querySelectorAll('#speed button').forEach(b=>b.onclick=()=>setSpeed(+b.dataset.speed));$('settings').onclick=()=>{ $('modal').innerHTML='<h2>⚙ Настройки города</h2><p>Прогресс сохраняется автоматически каждые несколько игровых дней.</p><p>Управление: один палец — перемещение камеры или рисование дороги/зоны; щипок — масштаб; два пальца — поворот.</p><div class="actions"><button id="saveNow">Сохранить</button><button id="loadNow">Загрузить</button><button id="newNow">Новая игра</button><button id="close">Закрыть</button></div>';$('modal').style.display='block';$('saveNow').onclick=saveGame;$('loadNow').onclick=loadGame;$('newNow').onclick=()=>{if(confirm('Сбросить город?'))newGame()};$('close').onclick=()=>$('modal').style.display='none'};}
function renderCards(){const cards=$('cards');cards.innerHTML='';const ids=CATEGORIES.find(c=>c[0]===activeCategory)?.[2]||[];ids.forEach(id=>{const b=document.createElement('button');if(id==='bulldoze'){b.innerHTML='<b>🧹 Снос</b><small>Удалить объект</small>'}else if(id==='budget'){b.innerHTML='<b>💰 Бюджет</b><small>Налоги и баланс</small>'}else if(id==='save'){b.innerHTML='<b>💾 Сохранить</b><small>Записать город</small>'}else if(id==='load'){b.innerHTML='<b>📂 Загрузить</b><small>Продолжить игру</small>'}else if(id==='new'){b.innerHTML='<b>🔄 Новый город</b><small>Начать сначала</small>'}else{const t=TYPES[id];b.innerHTML=`<b>${({road:'🛣',dirt:'🟤',avenue:'🚘',res:'🟩',com:'🟦',ind:'🟨',office:'🟦',power:'☀️',water:'💧',park:'🌳',fire:'🚒',school:'🏫'})[id]} ${t.name}</b><small>₡${format(t.price)}${t.maint?' • ₡'+t.maint+'/мес.':''}</small>`}b.className=id===activeTool?'active':'';b.onclick=()=>{if(id==='budget'){showBudget();return}if(id==='save'){saveGame();return}if(id==='load'){loadGame();return}if(id==='new'){if(confirm('Начать новый город?'))newGame();return}activeTool=id;document.querySelectorAll('#cards button').forEach(v=>v.classList.toggle('active',v===b));$('hint').textContent=TYPES[id]?.kind==='road'?'Проводи пальцем по карте, чтобы рисовать дорогу':TYPES[id]?.kind==='zone'?'Проводи пальцем по карте рядом с дорогой, чтобы зонировать':'Коснись свободного места на карте для строительства'};cards.appendChild(b)});}
function serializable(){return {...state,selected:null}}
function saveGame(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(serializable()));$('modal').style.display='none';toast('Город сохранён на этом устройстве 💾')}catch(e){toast('Не удалось сохранить игру')}}
function autosaveGame(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(serializable()))}catch(e){}}
function clearWorldObjects(){for(const m of [...roadMeshes.values(),...zoneMeshes.values(),...buildingMeshes.values()])scene.remove(m);roadMeshes.clear();zoneMeshes.clear();buildingMeshes.clear()}
function loadGame(){try{const raw=localStorage.getItem(SAVE_KEY);if(!raw){toast('Сохранение не найдено');return}const data=JSON.parse(raw);clearWorldObjects();Object.assign(state,data);state.selected=null;state.roads.forEach(r=>placeRoad(r.x,r.z,r.type,true));state.zones.forEach(z=>{const p=worldPos(z.x,z.z),g=groupAt(p.x,groundY(z.x,z.z)+.06,p.z),m=box(1.6,.035,1.6,TYPES[z.type].color,0,0,0,g);m.material.transparent=true;m.material.opacity=.38;m.userData.pickable=true;m.userData.ref={kind:'zone',k:z.k};zoneMeshes.set(z.k,g)});state.buildings.forEach(b=>renderBuilding(b));$('modal').style.display='none';refreshUI();toast('Город загружен');}catch(e){toast('Сохранение повреждено или несовместимо')}}
function newGame(){clearWorldObjects();state.money=12000;state.day=1;state.month=5;state.year=1;state.hour=8;state.speed=1;state.pop=0;state.happiness=72;state.taxes={res:9,com:10,ind:11};state.roads=[];state.zones=[];state.buildings=[];state.serial=1;state.demand={res:70,com:45,ind:55};initStartingTown();$('modal').style.display='none';refreshUI();setSpeed(1);addNews('Новый город основан. Построй электростанцию и водонапорную башню!')}
function initStartingTown(){for(let x=17;x<=25;x++)placeRoad(x,24,'road',true);for(let z=21;z<=27;z++)placeRoad(21,z,'road',true);for(let x=17;x<26;x+=2)placeZone(x,22,'res',true)}
// ─── Main loop: симуляция отдельно от отрисовки ──────────────────────────────
let last=performance.now();
function animate(now){requestAnimationFrame(animate);const dt=Math.min((now-last)/1000,.05);last=now;simulate(dt);dayNight();for(let i=effects.length-1;i>=0;i--){const e=effects[i];e.t+=dt;const k=clamp(e.t/e.duration,0,1);if(e.type==='bounce'){const s=k<.7?(.05+.95*(k/.7)):(1+.08*Math.sin((k-.7)/.3*Math.PI)*(1-k));e.obj.scale.setScalar(s)}if(k>=1){if(e.type==='bounce')e.obj.scale.setScalar(1);effects.splice(i,1)}}camTarget.x=clamp(camTarget.x,-42,42);camTarget.z=clamp(camTarget.z,-42,42);renderer.render(scene,camera)}
// ─── Запуск ─────────────────────────────────────────────────────────────────
try{init3D();buildUI();refreshUI();if(localStorage.getItem(SAVE_KEY))addNews('Добро пожаловать! Можно загрузить предыдущее сохранение через меню.');else addNews('Добро пожаловать, мэр! Начни с электростанции и водонапорной башни.');requestAnimationFrame(animate);setInterval(()=>{if(state.speed!==0){state.hour=(state.hour+1)%24;if(state.hour===0){state.day++;dailyTick()}refreshUI()}},8000); }catch(err){console.error(err);$('news').textContent='Не удалось запустить 3D. Проверь подключение к интернету и перезагрузи страницу.'}
})();
</script>
</body>
</html>
